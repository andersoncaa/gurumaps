# Save in your repo as .github/workflows/update-snotel.yml
name: Update SNOTEL GeoJSON
on:
  schedule:
    - cron: "7 */3 * * *"    # every 3 hours (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build GeoJSON
        run: python3 snotel_geojson.py --states UT --out snotel.geojson
      - name: Commit if changed
        run: |
          git config user.name "snotel-bot"
          git config user.email "snotel-bot@users.noreply.github.com"
          git add snotel.geojson
          git diff --cached --quiet || (git commit -m "Update SNOTEL data" && git push)
